<script>
    
    // CONSTANTS, ARRAYS, GLOBALS
    const REFRESH_INTERVAL_MS = 600000; // 10m
    let allFlights = []
    let filteredFlights = []
    let filtertimeout = null;
    let fetchDataInterval = null;
    let airportBarChart = null; // reference to the chart instance - BAR CHART - flights per airport
    let airportPieChart = null; // reference to the chart instance - Pie CHART - per airline


    document.addEventListener('DOMContentLoaded', function()
    {
        //fetchFlights();
        startAutoRefresh();
    })

    document.querySelectorAll('.nav-link').forEach(link =>
    {

            switchView(link.dataset.page)
        })
    }
    )
    // FUNCS

    function switchView(pageName)
    {
        document.querySelectorAll(".view").forEach(v => 
        {
            v.classList.remove('active');
        });

        const targetView = document.getElementById(`view-${pageName}`);
        if(targetView)
        {
            targetView.classList.add('active');
        }

        document.querySelectorAll('nav-link').forEach(link =>
        {
            link.classList.remove('active');
            if(link.dataset.page == pageName)
            {
                link.classList.add('active');
            }
        });

        if(pageName == 'stats')
        {
            renderStatistics();
            // todo: add draw chart here
        }
    }



    function startAutoRefresh()
    {
        if(fetchDataInterval)
        {
             clearInterval(fetchDataInterval)   
        }
        fetchDataInterval = setInterval(function()
        {
            console.log("Sending GET request");
            fetchFlights();
        },REFRESH_INTERVAL_MS);

    }

    document.getElementById('search').addEventListener('input',function()
    {
        clearTimeout(filtertimeout);
        filtertimeout = setTimeout(function(){
            filterTable()
        },300)
    })


    document.addEventListener("scroll", function()
    {
        const btn = document.getElementById("scrollTopBtn");
        if(window.scrollY > 300)
        {
            btn.style.display = 'block';
        }else
        {
            btn.style.display = 'none';
        }     
    })
    document.getElementById("scrollTopBtn").addEventListener("click",function(){
        window.scrollTo({top:0,behavior:"smooth"});
    })
     
    
    function getStatusObj()
    {
        return document.getElementById('status');
    }
    
    function setStatus(text)
    {
        console.log(text)
        const container = document.getElementById('status');
        if(text === "Loading")
        {
            container.innerHTML = `
            <div class="loader-container">
                <p>${text}</p>
                <div class="spinner"></div>
            </div>`; 
        }
        else 
        {
            container.innerHTML = `<p> ${text} </p>`;
        }
    }
     
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchFlights(bForce=false) 
    {
            try
            {
                setStatus("Loading") ;
                url = '/api/get_flights'
 
                // do we want to get data for all airports or just one specific?
                airport = document.getElementById('airportFilter').value; // returns ex. 'all','gdn', 'szz'
               
                params = []

                if(bForce)
                {
                    params.push('refresh=true');
                }
                if(airport != 'all')
                {
                    params.push(`airports=${airport}`)
                }

                if(params.length > 0)
                {
                    url += '?' + params.join('&')
                }

                const response = await fetch(url); 
                
                if(!response.ok)
                {
                    const errorText = await response.text();
                    
                    let userMessage = `Server error ${response.status} : (${errorText})`;


                    if(response.status === 500)
                    {
                        userMessage = "Internal error. Please try again later.";

                    } else if(response.status === 404)
                    {
                        userMessage = "Not found. Please try again later.";
                    }  else if(response.status === 429)
                    {
                        userMessage = "Too many requests. Please try again later.";
                    }  

                    setStatus(` ${userMessage}`);
                    renderTable([], response.status);
                    return;
                }
                let data;
                try
                {
                    data = await response.json();

                }catch(jsonError)
                {
                    setStatus(" Server returned invalid data. Please try again.");
                    renderTable([], 500);
                    return;
                }

                const bCached = data.cached;

                allFlights = data.flights;
                if(!data || !allFlights)
                {
                    setStatus("Error parsing flights data (sever sent invalid data?). Please try again.");
                    renderTable([], 500);
                    return;    
                }
                setStatus(`Done... (${bCached == true? "from Cache" : "new"} - ${allFlights.length} objects)`);
              
                renderTable(allFlights,response.status); 
            } 
            catch(NetworkError)
            {
                setStatus(`Cannot connect to server. Check your network connection: ${NetworkError} `);
                renderTable([], 500);
            }
        }

    function renderTable(flights, searchResponseStatus = 0) 
    {
             
          
            if (flights.length <= 0)
            {
                //alert(`Error: ${searchResponseStatus}`); 
                return;
            } 
            const search = document.getElementById('search').value.toLowerCase();
            const airport = document.getElementById('airportFilter').value;
            const type = document.getElementById('typeFilter').value;
            let html = `<p>Found ${flights.length} flights.</p>`;
            const container = document.getElementById('status');
            const statusElement = document.getElementById('status');
                
            if (flights.length > 0 && searchResponseStatus === 200) { 
                html = `<p>Found ${flights.length} flights. <span style="color:green"> (Success)</span></p>`;  
            }

            html += `<table class="filter-bar">
                <thead>
                    <th><button>Airport</button></th>
                    <th>Type</th>
                    <th>Airline</th>
                    <th>Flight</th>
                    <th>Destination/Origin</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Gate</th>
                    <th>Terminal</th>
                    <th>Status</th>
                </thead>`;

             

            flights.forEach((f,i) => 
            {
                let bgClass = (i % 2 === 0) ? 'row-lightish' : 'row-darkish';
                let shadowColour = "row-text-yellowish"; 
                 
                let whenFlight = isFlightPastNowFuture(f)
                 
                if(whenFlight == 'today')
                {
                    // today
                    //shadowColour = 'row-text-yellowish'
                }else if (whenFlight == 'future')
                {
                    // future
                    shadowColour = 'row-text-blueish';
                } 
                else
                {
                    // past
                    shadowColour = 'row-text-redish';
                } 

                bgClass += ` ${shadowColour}`;
                
                html += `<tr class="${bgClass}">
                    <td><strong>${f.code || '??'}</strong></td>
                    <td>${f.type || 'unknown'}</td>
                    <td>${f.carrier || 'N/A'}</td>
                    <td>${f.flightNum || 'N/A'}</td>
                    <td>${(f.type === 'arrival' ? f.origin : f.destination) || 'N/A'}</td>
                    <td>${f.date || 'N/A'}</td>
                    <td>${f.time || 'N/A'}</td>
                    <td>${f.gate || 'N/A'}</td>
                    <td>${f.terminal || 'N/A'}</td>
                    <td>${f.status || 'N/A'}</td>
                </tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;
    }
    function isFlightPastNowFuture(flight)
    {
        let dateDate = flight.date;
        let time = flight.time; // 00:00
        const dateString = dateDate.split('/');
        const timeString = time.split(':');

        const hour = parseInt(timeString[0],10);
        const minutes = parseInt(timeString[1],10);

        const day = parseInt(dateString[0],10);
        const month = parseInt(dateString[1],10)-1;
        const year = parseInt(dateString[2],10);

        const flightdate = new Date(year,month,day);
        
        const today = new Date();
        const currentHour = today.getHours();
        const currentMinute = today.getMinutes();

        today.setHours(0,0,0,0);
        if(flightdate.getTime() == today.getTime() ) // TODAY
        { 
            
        
            if(currentHour == hour && currentMinute < minutes) // flight about to happen soon ex. less than an hour
            {
                return 'today'
            }
            if(currentHour >= hour) // flight already happened ex. hour ago
                return 'past'
            else
                return 'today' // flight in the future, more than 1 hour from now
        }
        else if (flightdate.getTime() > today.getTime()) // FUTURE
        { 
            return 'future';
        } 
        else //PAST
        { 
            return 'past';
        } 
    }
    function filterTable() 
    {
        const search = document.getElementById('search').value.toLowerCase();
        const airport = document.getElementById('airportFilter').value;
        const type = document.getElementById('typeFilter').value.toLowerCase();
        //const timefilter = document.getElementById('timeFilter').value; // 'all', 'future', 'past'

        const showSoon = document.getElementById("showSoon").checked;
        const showPast = document.getElementById("showPast").checked;
        const showFuture = document.getElementById("showFuture").checked;

        const displayTimeFlights = [];
        if(showSoon)
        {
            displayTimeFlights.push('today');
        }
        if(showPast)
        {
            displayTimeFlights.push('past');
        }
        if(showFuture)
        {
            displayTimeFlights.push('future');
        }

        filteredFlights = allFlights.filter(f => 
        {
            const matchSearch = 
                String(f.flightNum || '').toLowerCase().includes(search) ||
                String(f.type === 'arrival' ? f.origin : f.destination || '').toLowerCase().includes(search) ||
                String(f.carrier || '').toLowerCase().includes(search) ||
                String(f.date || '').toLowerCase().includes(search) ||
                String(f.status || '').toLowerCase().includes(search) ||
                String(f.time || '').toLowerCase().includes(search);

            const time = isFlightPastNowFuture(f);
            const matchAirport = airport === 'all' || f.code === airport;
            const matchType = type === 'all' || f.type === type;
              
            const matchTime =  displayTimeFlights.length === 0 || displayTimeFlights.includes(time); 
            
            return matchSearch && matchAirport && matchType && matchTime;

        },[]); 
        renderTable(filteredFlights);
    }

    function loadData(bForce=false)
    {
        fetchFlights(bForce);
    }

     
    function exportCSV()
    {
        let csvContent = "Airport,Type,Airline,Flight Number,Destination/Origin,Date,Time,Gate, Terminal, Status\n";
        
        filteredFlights.forEach(f => 
        { 

            let row = [`${f.code || ''}`,
                `${f.type}`,
                `${f.carrier}`,
                `${f.flightNum}`,
                `${f.destination}`,
                `${f.date}`,
                `${f.time}`,
                `${f.gate}`,
                `${f.terminal}`,
                `${f.status}`
            ].join(",")
            csvContent += row + "\n";
        });

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob)
        const link = document.createElement("a");
        link.setAttribute("href",url);
        link.setAttribute("download",`airport_flight_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    function getFlightsPerAirport()
    {
        if(!allFlights || allFlights.length <= 0)
        {
            return null;
        }
        const counts = {};
        for (let flight of allFlights)
        {
            const code = flight.code;
            if(counts[code] === undefined)
            {
                counts[code] = 0;
            }
            counts[code] = ( counts[code] || 0) +1; 
        }
        
        // {"GDN":42,"KRK":41,...} 
        const keys = Object.keys(counts);
        const vals = Object.values(counts);

        let obj = {keys,vals};

        const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);

        const labels = sorted.map(item => item[0]);
        const values = sorted.map(item => item[1]);
        console.log({labels,values});
        return {labels,values};
    }
    function getFlightsPerAirline()
    {
        if(!allFlights || allFlights.length <= 0)
        {
            return null;
        }
        const normalizationMap = {
            "RYANAIR":"Ryanair",
            "Buzz / Ryanair Sun":"Ryanair",
            "RYANAIR SUN":"Ryanair",
            "Ryanair Sun":"Ryanair",
            "Ryanair (Polska)":"Ryanair",
            "BUZZ":"Ryanair",
            "WIZZ AIR":"Wizz Air",
            "PLL LOT": "LOT",
            "Polskie Linie Lotnicze LOT":"LOT",
            "easyjet Europe":"EasyJet",
            "ENTER AIR":"Enter Air",
            "EASYJET":"EasyJet",
            "EasyJet Switzerland":"EasyJet",
            "WIZZ AIR MALTA":"Wizz Air",
            "Eurowings":"",
            "Norwegian":"",
            "Pegasus":"",
        }
        const counts = {};
        for (let flight of allFlights)
        {
            const rawCarrier = flight.carrier;

            const carrier = normalizationMap[rawCarrier] || rawCarrier.trim();
            if(counts[carrier] === undefined)
            {
                counts[carrier] = 0;
            }
            counts[carrier] = ( counts[carrier] || 0) +1; 
        }
        
        // {"GDN":42,"KRK":41,...} 
        const keys = Object.keys(counts);
        const vals = Object.values(counts);

        let obj = {keys,vals};

        const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);

        topTen = sorted.slice(0,10);
        other = sorted.slice(10);
        if(other.length > 0)
        {
            sum = 0;
            other.forEach(item => {
                sum += item[1];
            });
            topTen.push(['other',sum]);
        }

        const labels = topTen.map(item => item[0]);
        const values = topTen.map(item => item[1]);
        console.log({labels,values});
        return {labels,values};
    }

    function renderStatistics()
    {
        const flightsPerAirport = getFlightsPerAirport();
        const airlinesPerAirport = getFlightsPerAirline();
        if(flightsPerAirport === null || airlinesPerAirport === null)
        {
            return;   
        }
        
        const ctx = document.getElementById('airportBarChart').getContext('2d');
        if (airportBarChart) {
            airportBarChart.destroy();
        }
        
        airportBarChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: flightsPerAirport.labels,
            datasets: [{
                label: 'Number of Flights',
                data: flightsPerAirport.values,
                backgroundColor: '#58a6ff',
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
